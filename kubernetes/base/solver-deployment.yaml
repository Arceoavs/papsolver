apiVersion: apps/v1
kind: Deployment
metadata:
  name: solver
  labels:
    app.kubernetes.io/name: centmatch
    app.kubernetes.io/component: solver
    app.kubernetes.io/part-of: centmatch
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: solver
  template:
    metadata:
      labels:
        app: solver
        app.kubernetes.io/name: centmatch
        app.kubernetes.io/component: solver
        app.kubernetes.io/part-of: centmatch
    spec:
      containers:
        - name: solver
          image: centmatch-api:latest
          imagePullPolicy: Always
          env:
            - name: SOLVER_MAX_CONCURRENT
              value: "2"
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 16Mi
            limits:
              cpu: "1"
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
