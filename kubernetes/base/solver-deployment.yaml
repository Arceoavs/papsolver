apiVersion: apps/v1
kind: Deployment
metadata:
  name: solver
  namespace: papsolvue
spec:
  replicas: 1
  selector:
    matchLabels:
      app: solver
  template:
    metadata:
      labels:
        app: solver
    spec:
      containers:
        - name: solver
          image: arceo99/solver:latest
          imagePullPolicy: Always
          env:
            - name: SOLVER_MAX_CONCURRENT
              value: "2"
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
