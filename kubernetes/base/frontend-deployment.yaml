apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
  namespace: papsolvue
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: arceo99/papsolvue:latest
          ports:
            - containerPort: 80
          env:
            - name: API_UPSTREAM
              value: http://solver-service.papsolvue.svc.cluster.local
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
