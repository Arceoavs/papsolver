openapi: 3.1.0
info:
  title: CentMatch API
  version: 3.1.0
  description: Match a balance exactly using the fewest purchases.
servers:
  - url: /
paths:
  /:
    get:
      operationId: getServiceInfo
      responses:
        "200":
          description: Service metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceInfo"
  /health:
    get:
      operationId: getHealth
      responses:
        "200":
          description: The service is ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /openapi.yaml:
    get:
      operationId: getOpenAPI
      responses:
        "200":
          description: This OpenAPI document.
          content:
            application/yaml:
              schema:
                type: string
  /solve:
    post:
      operationId: solve
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SolveRequest"
            examples:
              customCatalogue:
                summary: A custom labelled price list
                value:
                  targetCents: 696
                  tiers:
                    - id: coffee
                      label: Coffee
                      priceCents: 99
                    - id: sandwich
                      label: Sandwich
                      priceCents: 199
              legacyPricePoints:
                summary: Existing requests remain supported
                value:
                  targetCents: 696
                  tiers:
                    - id: deu-0009
                      priceCents: 99
                    - id: deu-0021
                      priceCents: 199
      responses:
        "200":
          description: A minimum-purchase exact solution.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SolveResponse"
              example:
                targetCents: 696
                purchaseCount: 4
                assignments:
                  - tierId: coffee
                    label: Coffee
                    priceCents: 99
                    quantity: 1
                  - tierId: sandwich
                    label: Sandwich
                    priceCents: 199
                    quantity: 3
        "409":
          description: No exact solution exists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "413":
          description: The request body is too large.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "415":
          description: The request is not JSON.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: The request is malformed or violates a domain constraint.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    ServiceInfo:
      type: object
      additionalProperties: false
      required: [title, version, description]
      properties:
        title:
          type: string
        version:
          type: string
        description:
          type: string
    Health:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          const: ok
    Tier:
      type: object
      additionalProperties: false
      required: [id, priceCents]
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 100
          description: Stable identifier for the price tier.
        label:
          type: string
          maxLength: 120
          description: Optional human-readable item or catalogue name. Surrounding whitespace is removed; a blank value is treated as omitted and control characters are rejected.
        priceCents:
          type: integer
          minimum: 1
          maximum: 1000000
    SolveRequest:
      type: object
      additionalProperties: false
      required: [targetCents, tiers]
      properties:
        targetCents:
          type: integer
          minimum: 1
          maximum: 100000
        tiers:
          type: array
          minItems: 1
          maxItems: 1000
          items:
            $ref: "#/components/schemas/Tier"
    Assignment:
      type: object
      additionalProperties: false
      required: [tierId, priceCents, quantity]
      properties:
        tierId:
          type: string
        label:
          type: string
          minLength: 1
          maxLength: 120
          description: The tier label supplied in the request, when present.
        priceCents:
          type: integer
          minimum: 1
        quantity:
          type: integer
          minimum: 1
    SolveResponse:
      type: object
      additionalProperties: false
      required: [targetCents, purchaseCount, assignments]
      properties:
        targetCents:
          type: integer
        purchaseCount:
          type: integer
          minimum: 1
        assignments:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/Assignment"
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
