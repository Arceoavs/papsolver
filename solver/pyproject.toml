[project]
name = "papsolver-api"
version = "2.0.0"
description = "FastAPI service for finding an exact prepaid-balance purchase combination"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.116.1",
    "pydantic>=2.11.7",
    "uvicorn[standard]>=0.35.0",
]

[dependency-groups]
dev = [
    "httpx2>=0.1.0",
    "pytest>=8.4.1",
    "ruff>=0.12.4",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
